<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Mobile Network - Quotation Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .section-title {
            font-size: 1.5em;
            color: #2a5298;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .items-section {
            margin-top: 30px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: start;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .item-row input,
        .item-row textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .item-row textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .item-row input:focus,
        .item-row textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.3em;
            transition: all 0.3s;
            height: fit-content;
            margin-top: 8px;
        }

        .remove-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .add-item-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .add-item-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 700;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .item-header {
            display: grid;
            grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr auto;
            gap: 15px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #2a5298;
            padding: 0 20px;
            font-size: 1.05em;
        }

        @media (max-width: 768px) {
            .item-row,
            .item-header {
                grid-template-columns: 1fr;
            }

            .remove-btn {
                width: 100%;
                margin-top: 10px;
            }

            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 ADITYA MOBILE NETWORK</h1>
            <p>Quotation Generator</p>
        </div>

        <div class="form-container">
            <form id="quotationForm">
                <div class="section-title">📋 Customer Information</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="billTo">Bill To (Name):</label>
                        <input type="text" id="billTo" required>
                    </div>
                    <div class="form-group">
                        <label for="billNo">Bill No:</label>
                        <input type="text" id="billNo" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea id="address" rows="2" required></textarea>
                    </div>
                </div>

                <div class="items-section">
                    <div class="section-title">🛒 Items</div>
                    <div class="item-header">
                        <div>Description of Services</div>
                        <div>Qty</div>
                        <div>Unit</div>
                        <div>Rate</div>
                        <div></div>
                    </div>
                    <div id="itemsContainer">
                        <div class="item-row">
                            <textarea class="item-desc" placeholder="Enter detailed item description here..." rows="3" required></textarea>
                            <input type="number" class="item-qty" placeholder="Qty" min="1" value="1" required>
                            <input type="text" class="item-unit" placeholder="Unit" value="Pcs" required>
                            <input type="number" class="item-rate" placeholder="Rate" min="0" step="0.01" required>
                            <button type="button" class="remove-btn" onclick="removeItem(this)">×</button>
                        </div>
                    </div>
                    <button type="button" class="add-item-btn" onclick="addItem()">+ Add Item</button>
                </div>

                <button type="submit" class="generate-btn">📄 Generate PDF Quotation</button>
            </form>
        </div>
    </div>

    <script>
        // Add item function
        function addItem() {
            const container = document.getElementById('itemsContainer');
            const newItem = document.createElement('div');
            newItem.className = 'item-row';
            newItem.innerHTML = `
                <textarea class="item-desc" placeholder="Enter detailed item description here..." rows="3" required></textarea>
                <input type="number" class="item-qty" placeholder="Qty" min="1" value="1" required>
                <input type="text" class="item-unit" placeholder="Unit" value="Pcs" required>
                <input type="number" class="item-rate" placeholder="Rate" min="0" step="0.01" required>
                <button type="button" class="remove-btn" onclick="removeItem(this)">×</button>
            `;
            container.appendChild(newItem);
        }

        // Remove item function
        function removeItem(btn) {
            const itemRows = document.querySelectorAll('.item-row');
            if (itemRows.length > 1) {
                btn.closest('.item-row').remove();
            } else {
                alert('At least one item is required!');
            }
        }

        document.getElementById('quotationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generatePDF();
        });

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Get form values
            const billTo = document.getElementById('billTo').value;
            const billNo = document.getElementById('billNo').value;
            const dateInput = document.getElementById('date').value;
            const address = document.getElementById('address').value;

            // Format date
            const date = new Date(dateInput);
            const formattedDate = date.toLocaleDateString('en-GB', { 
                day: '2-digit', 
                month: 'short', 
                year: 'numeric' 
            });

            // Colors
            const primaryBlue = [30, 60, 114];
            const redColor = [220, 53, 69];
            const greenBg = [144, 238, 144];

            // Left icon (signal bars - REVERSED/MIRRORED) - PROPER SPACING
            doc.setFillColor(primaryBlue[0], primaryBlue[1], primaryBlue[2]);
            doc.rect(40, 8, 3, 13, 'F');   // Tallest bar on the left
            doc.rect(44, 10, 3, 11, 'F');   // Second tallest
            doc.rect(48, 13, 3, 8, 'F');   // Third
            doc.rect(52, 15, 3, 6, 'F');   // Shortest on the right

            // Right icon (signal bars - NORMAL) - PROPER SPACING
            doc.setFillColor(primaryBlue[0], primaryBlue[1], primaryBlue[2]);
            doc.rect(155, 15, 3, 6, 'F');  // Shortest on the left
            doc.rect(159, 13, 3, 8, 'F');  // Third
            doc.rect(163, 10, 3, 11, 'F');  // Second tallest
            doc.rect(167, 8, 3, 13, 'F');  // Tallest bar on the right

            // Company name
            doc.setFontSize(28);
            doc.setTextColor(redColor[0], redColor[1], redColor[2]);
            doc.setFont(undefined, 'bold');
            doc.text('ADITYA', 105, 15, { align: 'center' });
            
            doc.setFontSize(16);
            doc.setTextColor(primaryBlue[0], primaryBlue[1], primaryBlue[2]);
            doc.text('MOBILE NETWORK SOLUTION', 105, 22, { align: 'center' });
            
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text('ALL INDIA SERVICE', 105, 28, { align: 'center' });
            
            doc.setFontSize(9);
            doc.setFont(undefined, 'normal');
            doc.text('Airport Road, Viman Nagar, Pune    Contact: 9172302928    Email: info@adityamobile.com', 105, 33, { align: 'center' });
            
            // Quotation box
            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.5);
            doc.rect(15, 40, 180, 8);
            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            doc.text('QUOTATION', 105, 45.5, { align: 'center' });

            // Bill details box
            doc.rect(15, 50, 135, 10);
            doc.rect(150, 50, 22, 10);
            doc.rect(172, 50, 23, 10);

            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.text('Bill to: ', 17, 54);
            doc.setFont(undefined, 'normal');
            doc.text(billTo, 28, 54);
            
            doc.setFont(undefined, 'bold');
            doc.text('Add: ', 17, 58);
            doc.setFont(undefined, 'normal');
            const addressLines = doc.splitTextToSize(address, 125);
            doc.text(addressLines, 28, 58);

            // BILL NO - Fixed positioning
            doc.setFont(undefined, 'bold');
            doc.setFontSize(8);
            doc.text('BILL NO', 161, 54, { align: 'center' });
            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);
            const billNoLines = doc.splitTextToSize(billNo, 20);
            doc.text(billNoLines, 161, 57, { align: 'center' });

            // DATE - Fixed positioning
            doc.setFont(undefined, 'bold');
            doc.setFontSize(8);
            doc.text('DATE', 183.5, 54, { align: 'center' });
            doc.setFont(undefined, 'normal');
            doc.setFontSize(8);
            const dateLines = doc.splitTextToSize(formattedDate, 21);
            doc.text(dateLines, 183.5, 57, { align: 'center' });

            // Table header
            const tableTop = 65;
            doc.setFillColor(greenBg[0], greenBg[1], greenBg[2]);
            doc.rect(15, tableTop, 15, 7, 'FD');
            doc.rect(30, tableTop, 85, 7, 'FD');
            doc.rect(115, tableTop, 15, 7, 'FD');
            doc.rect(130, tableTop, 20, 7, 'FD');
            doc.rect(150, tableTop, 20, 7, 'FD');
            doc.rect(170, tableTop, 25, 7, 'FD');

            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(0, 0, 0);
            doc.text('Sr No', 22.5, tableTop + 4.5, { align: 'center' });
            doc.text('Description', 72.5, tableTop + 4.5, { align: 'center' });
            doc.text('Qty', 122.5, tableTop + 4.5, { align: 'center' });
            doc.text('Unit', 140, tableTop + 4.5, { align: 'center' });
            doc.text('Rate', 160, tableTop + 4.5, { align: 'center' });
            doc.text('Amount in INR', 182.5, tableTop + 4.5, { align: 'center' });

            // Get items
            const itemRows = document.querySelectorAll('.item-row');
            const items = [];
            let totalAmount = 0;

            itemRows.forEach((row, index) => {
                const desc = row.querySelector('.item-desc').value;
                const qty = parseFloat(row.querySelector('.item-qty').value);
                const unit = row.querySelector('.item-unit').value;
                const rate = parseFloat(row.querySelector('.item-rate').value);
                const amount = qty * rate;
                totalAmount += amount;

                items.push({
                    srNo: index + 1,
                    description: desc,
                    qty: qty,
                    unit: unit,
                    rate: rate.toFixed(0),
                    amount: amount.toFixed(0)
                });
            });

            // Draw items
            let yPos = tableTop + 7;
            doc.setFont(undefined, 'normal');

            items.forEach((item) => {
                const descLines = doc.splitTextToSize(item.description, 80);
                const rowHeight = Math.max(10, descLines.length * 4 + 3);
                
                // Draw row borders
                doc.rect(15, yPos, 15, rowHeight);
                doc.rect(30, yPos, 85, rowHeight);
                doc.rect(115, yPos, 15, rowHeight);
                doc.rect(130, yPos, 20, rowHeight);
                doc.rect(150, yPos, 20, rowHeight);
                doc.rect(170, yPos, 25, rowHeight);

                // Add content
                doc.text(item.srNo.toString(), 22.5, yPos + 5, { align: 'center' });
                doc.text(descLines, 32, yPos + 4);
                doc.text(item.qty.toString(), 122.5, yPos + 5, { align: 'center' });
                doc.text(item.unit, 140, yPos + 5, { align: 'center' });
                doc.text(item.rate, 167, yPos + 5, { align: 'right' });
                doc.text(item.amount, 192, yPos + 5, { align: 'right' });

                yPos += rowHeight;
            });

            // Total
            doc.setFont(undefined, 'bold');
            doc.setFontSize(10);
            doc.rect(15, yPos, 155, 8);
            doc.rect(170, yPos, 25, 8);
            doc.text('Payment Term : 50% Advance                                                                   TOTAL', 165, yPos + 5.5, { align: 'right' });
            doc.text(totalAmount.toFixed(0), 192, yPos + 5.5, { align: 'right' });

            // Save PDF
            doc.save(`Quotation_${billNo}_${formattedDate.replace(/ /g, '_')}.pdf`);
        }

        // Set today's date as default
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('date').valueAsDate = new Date();
        });
    </script>
</body>
</html>
